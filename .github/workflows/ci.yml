name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  COVERAGE_IGNORE: 'src/main\.rs'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --no-fail-fast

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo llvm-cov nextest --no-report
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only --ignore-filename-regex "$COVERAGE_IGNORE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate (99% lines)
        run: cargo llvm-cov report --fail-under-lines 99 --ignore-filename-regex "$COVERAGE_IGNORE"

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: ./target/debug/voice-enforcer validate --ruleset examples/ruleset
      - run: ./target/debug/voice-enforcer check --ruleset examples/ruleset README.md docs/
